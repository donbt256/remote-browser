name: Remote Chromium Browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-chromium-browser
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PROFILE_REPO: donbt256/browser-profile-storage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl jq gnupg git nodejs npm

          curl -fsSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Download saved profile
        env:
          STORAGE_TOKEN: ${{ secrets.PROFILE_STORAGE_TOKEN }}
          PROFILE_KEY: ${{ secrets.PROFILE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          REPO_DIR="$RUNNER_TEMP/profile-repo"
          CONFIG_DIR="$RUNNER_TEMP/chromium-config"

          mkdir -p "$CONFIG_DIR"

          git clone \
            "https://x-access-token:${STORAGE_TOKEN}@github.com/${PROFILE_REPO}.git" \
            "$REPO_DIR"

          if [ -f "$REPO_DIR/profile.tar.gz.gpg" ]; then
            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "$PROFILE_KEY" \
              --decrypt \
              --output "$RUNNER_TEMP/profile.tar.gz" \
              "$REPO_DIR/profile.tar.gz.gpg"

            tar -xzf "$RUNNER_TEMP/profile.tar.gz" \
              -C "$CONFIG_DIR"

            echo "Previous browser profile restored."
          else
            echo "No saved profile yet; starting fresh."
          fi

          chmod -R u+rwX "$CONFIG_DIR"

      - name: Build and start noVNC desktop
        run: |
          set -euo pipefail

          docker build -t remote-browser-novnc .docker/novnc

          docker run -d \
            --name chromium \
            --publish 127.0.0.1:6080:6080 \
            --shm-size=1g \
            --volume "$RUNNER_TEMP/chromium-config:/config" \
            remote-browser-novnc

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6080/vnc.html \
              -o /dev/null; then
              echo "noVNC desktop interface is ready."
              exit 0
            fi
            sleep 5
          done

          docker logs chromium
          exit 1

      - name: Start password and WebSocket-ticket proxy
        env:
          BROWSER_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${#BROWSER_PASSWORD}" -lt 16 ]; then
            echo "BROWSER_PASSWORD must be at least 16 characters."
            exit 1
          fi

          npm install --prefix "$RUNNER_TEMP/browser-proxy" http-proxy

          cat > "$RUNNER_TEMP/browser-proxy.js" <<'JAVASCRIPT'
          const http = require('http');
          const crypto = require('crypto');
          const httpProxy = require(
            process.env.RUNNER_TEMP + '/browser-proxy/node_modules/http-proxy'
          );

          const password = process.env.BROWSER_PASSWORD;
          if (!password || password.length < 16) {
            throw new Error('BROWSER_PASSWORD must be at least 16 characters.');
          }

          const proxy = httpProxy.createProxyServer({
            target: 'http://127.0.0.1:6080',
            changeOrigin: true,
            ws: true
          });

          function signature(expiry) {
            return crypto.createHmac('sha256', password)
              .update(expiry)
              .digest('hex');
          }

          function ticketSignature(expiry) {
            return crypto.createHmac('sha256', password)
              .update('websocket:' + expiry)
              .digest('hex');
          }

          function validTicket(value) {
            const i = value.indexOf('.');
            if (i < 0) return false;
            const expiry = value.slice(0, i);
            const supplied = value.slice(i + 1);
            if (!/^\\d+$/.test(expiry) ||
                Number(expiry) <= Math.floor(Date.now() / 1000) ||
                Number(expiry) > Math.floor(Date.now() / 1000) + 125 ||
                !/^[a-f0-9]{64}$/.test(supplied)) return false;
            const expected = ticketSignature(expiry);
            return crypto.timingSafeEqual(
              Buffer.from(supplied, 'hex'),
              Buffer.from(expected, 'hex')
            );
          }

          function validSession(req) {
            const cookies = Object.fromEntries(
              (req.headers.cookie || '').split(';').map(part => {
                const i = part.indexOf('=');
                return i < 0
                  ? ['', '']
                  : [part.slice(0, i).trim(), part.slice(i + 1).trim()];
              }).filter(([key]) => key)
            );

            const value = cookies.rb_session || '';
            const i = value.indexOf('.');
            if (i < 0) return false;

            const expiry = value.slice(0, i);
            const supplied = value.slice(i + 1);

            if (!/^\d+$/.test(expiry) ||
                Number(expiry) <= Math.floor(Date.now() / 1000) ||
                !/^[a-f0-9]{64}$/.test(supplied)) {
              return false;
            }

            const expected = signature(expiry);
            return crypto.timingSafeEqual(
              Buffer.from(supplied, 'hex'),
              Buffer.from(expected, 'hex')
            );
          }

          function sendLogin(res, failed = false) {
            res.writeHead(200, {
              'Content-Type': 'text/html; charset=utf-8',
              'Cache-Control': 'no-store',
            });

            res.end(`<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Remote Chromium Login</title>
            <style>
              body {
                margin: 0; min-height: 100vh; display: grid;
                place-items: center; background: #171717;
                color: #eee; font: 16px system-ui, sans-serif;
              }
              form {
                width: min(320px, 85vw); display: grid; gap: 14px;
              }
              input, button {
                box-sizing: border-box; padding: 12px;
                font: inherit; border-radius: 6px;
              }
              input { background: #252525; color: white; border: 1px solid #555; }
              button { cursor: pointer; }
              p { color: #ff9999; }
            </style>
          </head>
          <body>
            <form method="post" action="/login">
              <h2>Remote Chromium</h2>
              <label for="password">Browser password</label>
              <input id="password" name="password" type="password"
                     autocomplete="current-password" required autofocus>
              <button type="submit">Sign in</button>
              ${failed ? '<p>Incorrect password. Try again.</p>' : ''}
            </form>
          </body>
          </html>`);
          }

          const server = http.createServer((req, res) => {
            const url = new URL(req.url, 'http://localhost');
            const bypass = '?ngrok-skip-browser-warning=true';

            if (url.pathname === '/login' && req.method === 'GET') {
              return sendLogin(res);
            }

            if (url.pathname === '/login' && req.method === 'POST') {
              let body = '';
              req.on('data', chunk => {
                body += chunk;
                if (body.length > 8192) req.destroy();
              });

              req.on('end', () => {
                const form = new URLSearchParams(body);
                const submitted = form.get('password') || '';
                const a = Buffer.from(submitted);
                const b = Buffer.from(password);
                const matches = a.length === b.length &&
                  crypto.timingSafeEqual(a, b);

                if (!matches) return sendLogin(res, true);

                const expiry = String(
                  Math.floor(Date.now() / 1000) + 8 * 60 * 60
                );

                res.writeHead(303, {
                  'Set-Cookie':
                    `rb_session=${expiry}.${signature(expiry)}; ` +
                    'Path=/; HttpOnly; Secure; SameSite=None; Max-Age=28800',
                  'Cache-Control': 'no-store',
                  'Location': '/' + bypass
                });
                res.end();
              });
              return;
            }

            if (url.pathname === '/api/session' && req.method === 'POST') {
              res.setHeader('Access-Control-Allow-Origin', '*');
              res.setHeader('Cache-Control', 'no-store');
              res.setHeader('Content-Type', 'application/json; charset=utf-8');
              let body = '';
              req.on('data', chunk => {
                body += chunk;
                if (body.length > 8192) req.destroy();
              });
              req.on('end', () => {
                const form = new URLSearchParams(body);
                const submitted = form.get('password') || '';
                const a = Buffer.from(submitted);
                const b = Buffer.from(password);
                const matches = a.length === b.length && crypto.timingSafeEqual(a, b);
                if (!matches) {
                  res.writeHead(401);
                  return res.end(JSON.stringify({ error: 'Incorrect password.' }));
                }
                const expiry = String(Math.floor(Date.now() / 1000) + 120);
                const ticket = expiry + '.' + ticketSignature(expiry);
                res.writeHead(200);
                res.end(JSON.stringify({ ticket, expires_in: 120 }));
              });
              return;
            }

            if (!validSession(req)) {
              res.writeHead(303, {
                'Cache-Control': 'no-store',
                'Location': '/login' + bypass
              });
              return res.end();
            }

            if (url.pathname === '/') {
              res.writeHead(302, {
                'Cache-Control': 'no-store',
                'Location': '/vnc.html?autoconnect=true&resize=remote&path=websockify'
              });
              return res.end();
            }

            proxy.web(req, res);
          });

          server.on('upgrade', (req, socket, head) => {
            const url = new URL(req.url, 'http://localhost');
            const ticket = url.searchParams.get('ticket') || '';
            if (!validTicket(ticket)) {
              socket.end(
                'HTTP/1.1 401 Unauthorized\\r\\n' +
                'Connection: close\\r\\n\\r\\n'
              );
              return;
            }
            proxy.ws(req, socket, head);
          });

          function removeFrameRestrictions(headers) {
            delete headers['x-frame-options'];

            for (const name of [
              'content-security-policy',
              'content-security-policy-report-only'
            ]) {
              const value = headers[name];
              if (!value) continue;

              const policies = (Array.isArray(value) ? value : [value])
                .map(policy => policy
                  .split(';')
                  .filter(directive =>
                    !/^\s*frame-ancestors(?:\s|$)/i.test(directive)
                  )
                  .join(';'))
                .filter(Boolean);

              if (policies.length) headers[name] = policies;
              else delete headers[name];
            }
          }

          proxy.on('proxyRes', proxyRes => {
            removeFrameRestrictions(proxyRes.headers);
          });

          proxy.on('error', (err, req, res) => {
            console.error('noVNC proxy error:', err.message);
            if (res && !res.headersSent && typeof res.writeHead === 'function') {
              res.writeHead(502);
              res.end('The noVNC desktop is unavailable.');
            } else if (res && typeof res.destroy === 'function') {
              res.destroy();
            }
          });

          server.listen(8080, '127.0.0.1', () => {
            console.log('Password and WebSocket-ticket proxy listening on port 8080.');
          });
          JAVASCRIPT

          RUNNER_TEMP="$RUNNER_TEMP" \
            BROWSER_PASSWORD="$BROWSER_PASSWORD" \
            node "$RUNNER_TEMP/browser-proxy.js" \
            > "$RUNNER_TEMP/browser-proxy.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/browser-proxy.pid"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/login -o /dev/null; then
              echo "Password and WebSocket-ticket proxy is ready."
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/browser-proxy.log"
          exit 1

      - name: Start secure tunnel
        run: |
          set -euo pipefail

          ngrok http 8080 \
            --log=stdout \
            > "$RUNNER_TEMP/ngrok.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/ngrok.pid"

          for i in $(seq 1 60); do
            URL=$(curl -fsS http://127.0.0.1:4040/api/tunnels \
              | jq -r \
                '[.tunnels[] | select(.proto == "https")][0].public_url // empty' \
              2>/dev/null || true)

            if [ -n "$URL" ]; then
              {
                echo "## Remote Chromium (noVNC)"
                echo
                echo "URL: $URL"
                echo
                echo "Open this URL in the local noVNC viewer."
                echo "Sign in using your BROWSER_PASSWORD secret."
              } >> "$GITHUB_STEP_SUMMARY"

              echo "noVNC URL: $URL"
              exit 0
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/ngrok.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ngrok.log"
              exit 1
            fi

            sleep 5
          done

          cat "$RUNNER_TEMP/ngrok.log"
          exit 1

      - name: Keep browser available
        run: |
          set -euo pipefail

          echo "Use the browser URL in the workflow summary."
          echo "Cancel this workflow when finished."

          while true; do
            if ! docker inspect -f '{{.State.Running}}' chromium \
              | grep -qx true; then
              echo "The noVNC desktop stopped unexpectedly."
              docker logs chromium
              exit 1
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/browser-proxy.pid")" 2>/dev/null; then
              echo "Password and WebSocket-ticket proxy stopped unexpectedly."
              cat "$RUNNER_TEMP/browser-proxy.log"
              exit 1
            fi

            sleep 30
          done

      - name: Save encrypted browser profile
        if: always()
        env:
          STORAGE_TOKEN: ${{ secrets.PROFILE_STORAGE_TOKEN }}
          PROFILE_KEY: ${{ secrets.PROFILE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          CONFIG_DIR="$RUNNER_TEMP/chromium-config"
          REPO_DIR="$RUNNER_TEMP/profile-repo"

          docker stop -t 30 chromium 2>/dev/null || true

          if [ ! -d "$CONFIG_DIR" ] ||
             [ -z "$(find "$CONFIG_DIR" -mindepth 1 -print -quit)" ]; then
            echo "No profile data to save."
            exit 0
          fi

          tar -czf "$RUNNER_TEMP/profile.tar.gz" \
            --exclude='*/Cache/*' \
            --exclude='*/Code Cache/*' \
            --exclude='*/GPUCache/*' \
            --exclude='*/GrShaderCache/*' \
            --exclude='*/DawnCache/*' \
            --exclude='*/Crashpad/*' \
            -C "$CONFIG_DIR" .

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$PROFILE_KEY" \
            --symmetric \
            --cipher-algo AES256 \
            --output "$REPO_DIR/profile.tar.gz.gpg" \
            "$RUNNER_TEMP/profile.tar.gz"

          cd "$REPO_DIR"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.tar.gz.gpg

          if git diff --cached --quiet; then
            echo "No profile changes to save."
            exit 0
          fi

          git commit -m "Save encrypted Chromium profile"
          git push origin HEAD

          echo "Encrypted browser profile saved."

      - name: Clean up
        if: always()
        run: |
          docker rm -f chromium 2>/dev/null || true

          if [ -f "$RUNNER_TEMP/browser-proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/browser-proxy.pid")" 2>/dev/null || true
          fi

          if [ -f "$RUNNER_TEMP/ngrok.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ngrok.pid")" 2>/dev/null || true
          fi
