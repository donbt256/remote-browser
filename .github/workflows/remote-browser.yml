
name: Remote Chromium Browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-chromium-browser
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PROFILE_REPO: donbt256/browser-profile-storage

    steps:
      - name: Install dependencies
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl jq gnupg git

          curl -fsSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Download saved profile
        env:
          STORAGE_TOKEN: ${{ secrets.PROFILE_STORAGE_TOKEN }}
          PROFILE_KEY: ${{ secrets.PROFILE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          REPO_DIR="$RUNNER_TEMP/profile-repo"
          CONFIG_DIR="$RUNNER_TEMP/chromium-config"

          mkdir -p "$CONFIG_DIR"

          git clone \
            "https://x-access-token:${STORAGE_TOKEN}@github.com/${PROFILE_REPO}.git" \
            "$REPO_DIR"

          if [ -f "$REPO_DIR/profile.tar.gz.gpg" ]; then
            gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "$PROFILE_KEY" \
              --decrypt \
              --output "$RUNNER_TEMP/profile.tar.gz" \
              "$REPO_DIR/profile.tar.gz.gpg"

            tar -xzf "$RUNNER_TEMP/profile.tar.gz" \
              -C "$CONFIG_DIR"

            echo "Previous browser profile restored."
          else
            echo "No saved profile yet; starting fresh."
          fi

          chmod -R u+rwX "$CONFIG_DIR"

      - name: Start Chromium
        run: |
          set -euo pipefail

          docker pull lscr.io/linuxserver/chromium:latest

          docker run -d \
            --name chromium \
            --publish 127.0.0.1:3000:3000 \
            --shm-size=1g \
            --volume "$RUNNER_TEMP/chromium-config:/config" \
            --env PUID=1000 \
            --env PGID=1000 \
            --env TZ=America/New_York \
            lscr.io/linuxserver/chromium:latest

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ \
              -o /dev/null; then
              echo "Chromium interface is ready."
              exit 0
            fi
            sleep 5
          done

          docker logs chromium
          exit 1

      - name: Start secure tunnel
        env:
          BROWSER_PASSWORD: ${{ secrets.BROWSER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${#BROWSER_PASSWORD}" -lt 16 ]; then
            echo "BROWSER_PASSWORD must be at least 16 characters."
            exit 1
          fi

          ngrok http 3000 \
            --basic-auth="browser:${BROWSER_PASSWORD}" \
            --log=stdout \
            > "$RUNNER_TEMP/ngrok.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/ngrok.pid"

          for i in $(seq 1 60); do
            URL=$(curl -fsS http://127.0.0.1:4040/api/tunnels \
              | jq -r \
                '[.tunnels[] | select(.proto == "https")][0].public_url // empty' \
              2>/dev/null || true)

            if [ -n "$URL" ]; then
              {
                echo "## Remote Chromium"
                echo
                echo "URL: $URL"
                echo
                echo "Username: browser"
                echo
                echo "Password: the BROWSER_PASSWORD secret"
              } >> "$GITHUB_STEP_SUMMARY"

              echo "Browser URL: $URL"
              exit 0
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/ngrok.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ngrok.log"
              exit 1
            fi

            sleep 5
          done

          cat "$RUNNER_TEMP/ngrok.log"
          exit 1

      - name: Keep browser available
        run: |
          set -euo pipefail

          echo "Use the browser URL in the workflow summary."
          echo "Cancel this workflow when finished."

          while true; do
            if ! docker inspect -f '{{.State.Running}}' chromium \
              | grep -qx true; then
              echo "Chromium stopped unexpectedly."
              docker logs chromium
              exit 1
            fi

            sleep 30
          done

      - name: Save encrypted browser profile
        if: always()
        env:
          STORAGE_TOKEN: ${{ secrets.PROFILE_STORAGE_TOKEN }}
          PROFILE_KEY: ${{ secrets.PROFILE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          CONFIG_DIR="$RUNNER_TEMP/chromium-config"
          REPO_DIR="$RUNNER_TEMP/profile-repo"

          # Stop Chromium before snapshotting SQLite databases.
          docker stop -t 30 chromium 2>/dev/null || true

          # Never overwrite the previous snapshot with an empty profile.
          if [ ! -d "$CONFIG_DIR" ] ||
             [ -z "$(find "$CONFIG_DIR" -mindepth 1 -print -quit)" ]; then
            echo "No profile data to save."
            exit 0
          fi

          tar -czf "$RUNNER_TEMP/profile.tar.gz" \
            --exclude='*/Cache/*' \
            --exclude='*/Code Cache/*' \
            --exclude='*/GPUCache/*' \
            --exclude='*/GrShaderCache/*' \
            --exclude='*/DawnCache/*' \
            --exclude='*/Crashpad/*' \
            -C "$CONFIG_DIR" .

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$PROFILE_KEY" \
            --symmetric \
            --cipher-algo AES256 \
            --output "$REPO_DIR/profile.tar.gz.gpg" \
            "$RUNNER_TEMP/profile.tar.gz"

          cd "$REPO_DIR"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.tar.gz.gpg

          if git diff --cached --quiet; then
            echo "No profile changes to save."
            exit 0
          fi

          git commit -m "Save encrypted Chromium profile"

          git push origin HEAD

          echo "Encrypted browser profile saved."

      - name: Clean up
        if: always()
        run: |
          docker rm -f chromium 2>/dev/null || true

          if [ -f "$RUNNER_TEMP/ngrok.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ngrok.pid")" 2>/dev/null || true
          fi
